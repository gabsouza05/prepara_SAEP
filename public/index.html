
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <h1>Gerenciamento de Tarefas</h1>

        <nav>
            <button onclick="mostrarPagina('usuarios')">Cadastro de Usuários</button>
            <button onclick="mostrarPagina('tarefas')">Cadastro de Tarefas</button>
            <button onclick="mostrarPagina('gerenciar')">Gerenciar Tarefas</button>
        </nav>
    </header>

    <main>

        <section id="usuarios" class="pagina">
            <h2>Cadastro de Usuários</h2>

            <form id="formUsuario">

                <label for="nome">Nome:</label>
                <input type="text" id="nome" maxlength="120" required>

                <label for="email">Email:</label>
                <input type="email" id="email" maxlength="160" required>

                <button type="submit">Cadastrar</button>

            </form>

            <h3>Usuários cadastrados</h3>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                    </tr>
                </thead>

                <tbody id="listaUsuarios"></tbody>
            </table>
        </section>

        <section id="tarefas" class="pagina" style="display:none">

            <h2>Cadastro de Tarefas</h2>

            <form id="formTarefa">

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" maxlength="500" required></textarea>

                <label for="setor">Setor:</label>
                <input type="text" id="setor" maxlength="120" required>

                <label for="usuario">Usuário:</label>
                <select id="usuario" required>
                    <option value="">Selecione um usuário</option>
                </select>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" required>
                    <option value="">Selecione</option>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <button type="submit" id="botaoTarefa">Cadastrar</button>

                <button type="button" id="cancelarEdicao" onclick="cancelarEdicao()" style="display:none">
                    Cancelar
                </button>

            </form>

        </section>

        <section id="gerenciar" class="pagina" style="display:none">

            <h2>Tarefas</h2>

            <div class="quadro">

                <div class="coluna">
                    <h3>A Fazer</h3>
                    <div id="listaAFazer"></div>
                </div>

                <div class="coluna">
                    <h3>Fazendo</h3>
                    <div id="listaFazendo"></div>
                </div>

                <div class="coluna">
                    <h3>Pronto</h3>
                    <div id="listaPronto"></div>
                </div>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
